name: reporte_itl
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.12.0
  flutter_dotenv: ^5.1.0
  image_picker: ^1.2.1
  cached_network_image: ^3.4.1
  shared_preferences: ^2.5.4
  window_manager: ^0.5.1
  flutter_cache_manager: ^3.4.1
  internet_connection_checker_plus: ^2.9.1+2
  image: ^4.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/.env

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.jpeg"
  macos:
    generate: true
  windows:
    generate: true
  linux:
    generate: true